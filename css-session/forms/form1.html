<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="form1.css">
</head>
<div class="form"> 

<body>

    <form id = "inform">

        <h1 style="text-align: center;">Student Registration Form</h1>
<label>Name</label>
<input type="text" placeholder="Enter your name"><br><br>

<label>Email</label>
<input type="text" placeholder="Enter your Email"><br><br>

<label> Password</label>
<input type="text" placeholder="Enter your password"><br><br>

<label> Age</label>
<input type="number" placeholder="Enter your age"><br><br>

<label>Date of Birth</label>
<input type="date"><br><br>

        <label>Gender:</label>
        <input type="radio" value="Male" name="gender">Male
        <input type="radio" value="Female" name="gender">Female
        <br><br>

        <label>Hobbies</label>
        <input type="checkbox" value="Reading">Reading
        <input type="checkbox" value="Sports"> Sports
        <br><br>

<h3><b> Student Information Table</b></h3>
<table id = "table" border="1">

    <tr>
        <th rowspan="2">Student </th>
        <th colspan="3">Acadamic Details</th>
    </tr>
    <tr>
        <th > Course</th>
        <th>Semester</th>
        <th> Grade</th>
    </tr>
    <tr>
        <td>Alpha</td>
        <td>CSIT</td>
        <td>1<sup>st</sup></td>
        <td> A</td>
    </tr>
    <tr>
        <td>Beta</td>
        <td>BCA</td>
        <td>2<sup>nd</sup></td>
        <td>B+</td>
    </tr><br>

</table><br><br>
<button id = "submit" type="submit">Submit</button>
<button id ="reset" type="reset">Reset</button>

</form><br>
</body>
</div >
</html>
