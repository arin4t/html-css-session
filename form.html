    <label>Name:</label>
    <input type="text" placeholder="Enter your name"><br><br>

    <label>Email:</label>
    <input type="email" placeholder="Enter your Email"><br><br>

    <label>Password:</label>
    <input type="password" placeholder="Enter your password"><br><br>

    <label>Phone Number:</label>
    <input type="number" placeholder="Enter your phone no"><br><br>

    <label>Date of Birth</label>
    <input type="date" placeholder="Enter your DOB"><br><br>

    <label>Message/feedback</label><br>
    <textarea placeholder="Enter Message/feedback" rows="10" cols="50"></textarea><br><br>


    <!-- checkbox-->
     <!-- values send data to server-->
      <label> Hobbies:</label>
      <input type="checkbox" value="Cricket">Cricket
      <input type="checkbox" value="football">football
      <input type="checkbox" value="chess">chess
      <input type="checkbox" value="dancing">dancing<br><br>


      <!-- Radio Button-->
       <label>Select your gender</label><br><br>
       <input type="radio" value="Male" name="gender">Male
       <input type="radio" value="Female" name="gender">Female
       <input type="radio" value="others" name="gender">others<br><br>


    <!-- Buttons-->
     <button>Login</button>
     <button>Register</button>
<br><br>


      <!-- Dropdown-->
       <label> Select cources</label><br><br>
       <select name="cources">
        <option value="0" disabled selected>Select cources</option>
        <option value="bca">BCA</option>
        <option value="csit">CSIT</option>
        <option value="bit">BIT</option>
        <option value="bba">BBA</option>
